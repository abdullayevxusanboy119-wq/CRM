      async function setAttendanceStatusQuick(studentId, date, status) {
        try {
          const existing = attendanceData.find(a => String(a.student_id) === String(studentId) && (a.date || '').startsWith(date));

          if (existing) {
            const response = await apiFetch(`/api/attendance/${existing.id}/`, {
              method: 'PUT',
              body: JSON.stringify({ status: status })
            });
            if (response.ok) {
              existing.status = status;
              toast('Davomat holati yangilandi!', 'success');
              if (currentYearVal && currentMonthVal) loadAttendanceData(currentGroupId, currentYearVal, currentMonthVal);
            }
          } else {
            const student = students.find(s => String(s.id) === String(studentId));
            const response = await apiFetch('/api/attendance/', {
              method: 'POST',
              body: JSON.stringify({
                student_id: studentId,
                group_id: student?.groupId || '',
                date: date,
                status: status
              })
            });
            if (response.ok) {
              const newAtt = await response.json();
              attendanceData.push({
                id: newAtt.id,
                student_id: studentId,
                group_id: student?.groupId || '',
                date: date,
                status: status
              });
              toast('Davomat holati yangilandi!', 'success');
              if (currentYearVal && currentMonthVal) loadAttendanceData(currentGroupId, currentYearVal, currentMonthVal);
            }
          }
        } catch(err) {
          console.error('Error updating attendance:', err);
          toast('Yangilashda xatolik', 'error');
        }
      }

      async function loadAttendanceData(groupId, year, month){
        if(!year || !month){
          document.getElementById('attendanceGrid').innerHTML = '<div class="empty-state"><div class="icon"><i class="fas fa-calendar-alt"></i></div><p>Iltimos, oy va yilni tanlang</p></div>';
          return;
        }

        currentGroupId = groupId;
        currentYearVal = year;
        currentMonthVal = month;

        let sts = [];
        if(groupId && groupId !== ''){
          sts = students.filter(s => String(s.groupId) === String(groupId));
        } else {
          sts = [...students];
        }

        if(sts.length === 0){
          document.getElementById('attendanceGrid').innerHTML = '<div class="empty-state"><div class="icon"><i class="fas fa-user-graduate"></i></div><p>Bu guruhda o\'quvchilar mavjud emas</p></div>';
          document.getElementById('attPagination').style.display = 'none';
          document.getElementById('attStats').innerHTML = '';
          return;
        }

        document.getElementById('attPagination').style.display = 'flex';

        const daysInMonth = new Date(year, month, 0).getDate();
        const dayArr = [];
        const fromDate = 1;
        const toDate = daysInMonth;
        for(let d = fromDate; d <= toDate; d++){
          dayArr.push(d);
        }

        const totalPages = Math.ceil(sts.length / perPage);
        if(attendancePage > totalPages) attendancePage = totalPages;
        if(attendancePage < 1) attendancePage = 1;

        const startIdx = (attendancePage - 1) * perPage;
        const pageStudents = sts.slice(startIdx, startIdx + perPage);

        try {
          const monthStr = `${year}-${String(month).padStart(2, '0')}`;
          const studentIds = pageStudents.map(s => s.id).join(',');
          const attRes = await apiFetch(`/api/attendance/?student_ids=${studentIds}&month=${monthStr}`);
          if (attRes.ok) {
            attendanceData = await attRes.json();
          } else {
            attendanceData = [];
          }
        } catch(err) {
          console.error('Error loading attendance data:', err);
          attendanceData = [];
        }

        let presentCount = 0, absentCount = 0, sickCount = 0, holidayCount = 0, lateCount = 0;

        let html = `
          <table class="attendance-table">
            <thead>
              <tr>
                <th><i class="fas fa-user-graduate"></i> O'quvchi</th>
                ${dayArr.map(d => `<th>${d}</th>`)}
              </tr>
            </thead>
            <tbody>
        `;

        pageStudents.forEach((st, idx) => {
          html += `<tr>`;
          html += `<td>${startIdx + idx + 1}. ${escapeHTML(st.firstName)} ${escapeHTML(st.lastName)}</td>`;

          dayArr.forEach(d => {
            const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const attRec = attendanceData.find(a => String(a.student_id) === String(st.id) && a.date.startsWith(dateStr));
            const status = attRec ? attRec.status : null;

            let statusClass = 'empty';
            let text = '<i class="fas fa-square" style="color:var(--gray400)"></i>';
            if(status === 'present'){ statusClass = 'present'; text = '<i class="fas fa-check-circle"></i>'; presentCount++; }
            else if(status === 'absent'){ statusClass = 'absent'; text = '<i class="fas fa-times-circle"></i>'; absentCount++; }
            else if(status === 'sick'){ statusClass = 'sick'; text = '<i class="fas fa-thermometer"></i>'; sickCount++; }
            else if(status === 'holiday'){ statusClass = 'holiday'; text = '<i class="fas fa-umbrella-beach"></i>'; holidayCount++; }
            else if(status === 'late'){ statusClass = 'late'; text = '<i class="fas fa-clock"></i>'; lateCount++; }

            html += `
              <td>
                <div class="day-cell ${statusClass}"
                     data-student="${escapeHTML(st.id)}"
                     data-date="${escapeHTML(dateStr)}"
                     onclick="showAttendanceQuickActions(event, '${escapeHTML(st.id)}','${escapeHTML(dateStr)}')"
                     title="Holatni o'zgartirish">
                  ${text}
                </div>
              </td>
            `;
          });

          html += `</tr>`;
        });

        html += `
            </tbody>
          </table>
        `;

        document.getElementById('attendanceGrid').innerHTML = html;
        document.getElementById('attPageInfo').textContent = `${attendancePage}/${totalPages}`;
        document.getElementById('attPrevPage').disabled = (attendancePage <= 1);
        document.getElementById('attNextPage').disabled = (attendancePage >= totalPages);

        const totalCells = pageStudents.length * dayArr.length;
        document.getElementById('attStats').innerHTML = `
          <i class="fas fa-chart-simple"></i> Keldi: <strong class="green">${presentCount}</strong> &nbsp;|&nbsp;
          Kelmadi: <strong class="red">${absentCount}</strong> &nbsp;|&nbsp;
          Kasal: <strong style="color:#FDE68A">${sickCount}</strong> &nbsp;|&nbsp;
          Ta'til: <strong style="color:#C4B5FD">${holidayCount}</strong> &nbsp;|&nbsp;
          Kechikish: <strong style="color:#93C5FD">${lateCount}</strong> &nbsp;|&nbsp;
          Bo'sh: <strong>${totalCells - presentCount - absentCount - sickCount - holidayCount - lateCount}</strong>
        `;
      }

      window.showAttendanceQuickActions = function(event, studentId, date) {
        event.stopPropagation();

        const cell = event.currentTarget;
        const quickActions = document.getElementById('attendanceQuickActions');

        document.querySelectorAll('.day-cell').forEach(c => {
          c.style.borderColor = 'transparent';
        });

        const rect = cell.getBoundingClientRect();

        let left = rect.left + rect.width / 2 - 100;
        let top = rect.top - 10;

        if (left < 10) left = 10;
        if (left + 200 > window.innerWidth) left = window.innerWidth - 210;
        if (top < 10) {
          top = rect.bottom + 10;
        }
        if (top + 250 > window.innerHeight) {
          top = window.innerHeight - 260;
        }

        quickActions.style.left = left + 'px';
        quickActions.style.top = top + 'px';
        quickActions.style.display = 'block';

        document.getElementById('reasonButtons').classList.remove('show');

        activeStudentId = studentId;
        activeDate = date;

        cell.style.borderColor = 'var(--primary)';
      };

      document.getElementById('attPrevPage').onclick = function(){
        if(attendancePage > 1){
          attendancePage--;
          if(currentYearVal && currentMonthVal) loadAttendanceData(currentGroupId, currentYearVal, currentMonthVal);
        }
      };

      document.getElementById('attNextPage').onclick = function(){
        let sts = [];
        if(currentGroupId && currentGroupId !== ''){
          sts = students.filter(s => String(s.groupId) === String(currentGroupId));
        } else {
          sts = [...students];
        }
        const totalPages = Math.ceil(sts.length / perPage);
        if(attendancePage < totalPages){
          attendancePage++;
          if(currentYearVal && currentMonthVal) loadAttendanceData(currentGroupId, currentYearVal, currentMonthVal);
        }
      };

      document.querySelectorAll('.month-btn').forEach(btn => {
        btn.onclick = function(){
          document.querySelectorAll('.month-btn').forEach(b => {
            b.classList.remove('active');
            b.style.background = 'var(--gray100)';
            b.style.color = 'var(--text-secondary)';
          });
          this.classList.add('active');
          this.style.background = 'var(--primary)';
          this.style.color = 'white';

          const month = parseInt(this.dataset.month);
          const year = parseInt(document.getElementById('attYear').value);
          const gid = document.getElementById('attGroup').value;

          attendancePage = 1;
          if(year) {
            loadAttendanceData(gid, year, month);
          } else {
            toast('Yilni tanlang', 'warning');
          }
        };
      });

      setTimeout(() => {
        const currentMonth = new Date().getMonth() + 1;
        document.querySelectorAll('.month-btn').forEach(btn => {
          if(parseInt(btn.dataset.month) === currentMonth) {
            btn.classList.add('active');
            btn.style.background = 'var(--primary)';
            btn.style.color = 'white';
          }
        });

        const gid = document.getElementById('attGroup').value;
        const year = parseInt(document.getElementById('attYear').value);
        if(year && currentMonth) {
          loadAttendanceData(gid, year, currentMonth);
        }
      }, 100);

      document.getElementById('attGroup').onchange = function(){
        const year = parseInt(document.getElementById('attYear').value);
        let month = null;
        document.querySelectorAll('.month-btn').forEach(btn => {
          if(btn.classList.contains('active')) {
            month = parseInt(btn.dataset.month);
          }
        });
        if(!month) month = new Date().getMonth() + 1;
        attendancePage = 1;
        if(year && month) loadAttendanceData(this.value, year, month);
      };

      document.getElementById('attYear').onchange = function(){
        const gid = document.getElementById('attGroup').value;
        const year = parseInt(this.value);
        let month = null;
        document.querySelectorAll('.month-btn').forEach(btn => {
          if(btn.classList.contains('active')) {
            month = parseInt(btn.dataset.month);
          }
        });
        if(!month) month = new Date().getMonth() + 1;
        attendancePage = 1;
        if(year && month) loadAttendanceData(gid, year, month);
      };
    }

    // ============================================================
    // PAYMENTS (API bilan)
    // ============================================================
    async function payments(el){
      el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fas fa-spinner fa-spin" style="font-size:32px"></i><p style="margin-top:12px">To\'lovlar yuklanmoqda...</p></div>';

      let data = [];
      let studentsData = [];
      let coursesData = [];

      try {
        const [paymentsRes, studentsRes, coursesRes] = await Promise.all([
          apiFetch('/api/payments/'),
          apiFetch('/api/students/'),
          apiFetch('/api/courses/')
        ]);
        data = await paymentsRes.json();
        studentsData = await studentsRes.json();
        coursesData = await coursesRes.json();
      } catch(err) {
        console.error('Error loading payments:', err);
        el.innerHTML = `<div class="empty-state" style="padding:40px">
          <div class="icon"><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i></div>
          <p style="color:var(--text-secondary);margin-top:12px">Ma'lumotlarni yuklashda xatolik yuz berdi</p>
          <button class="btn btn-primary" style="margin-top:12px" onclick="renderPage('payments')"><i class="fas fa-sync"></i> Qayta urinish</button>
        </div>`;
        return;
      }

      const studentMap = Object.fromEntries(studentsData.map(s => [s.id, s]));
      const courseMap = Object.fromEntries(coursesData.map(c => [c.id, c]));

      const paymentsData = data.map(p => ({
        id: p.id,
        studentId: p.student_id || p.studentId || '',
        courseId: p.course_id || p.courseId || '',
        amount: p.amount || 0,
        type: p.type || 'naqd',
        date: p.date || '',
        nextPaymentDate: p.next_payment_date || p.nextPaymentDate || '',
        status: p.status || 'unpaid',
        note: p.note || '',
        teacherId: p.teacher_id || p.teacherId || ''
      }));

      const totalPaid = paymentsData.filter(p => p.status === 'paid').reduce((s,p) => s + p.amount, 0);
      const unpaid = paymentsData.filter(p => p.status === 'unpaid').length;
      const partial = paymentsData.filter(p => p.status === 'partial').length;

      el.innerHTML = `
        <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div class="stat-content"><span class="stat-number">${formatCurrency(totalPaid)}</span><span class="stat-label">Jami tushum</span></div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-exclamation-circle"></i></div><div class="stat-content"><span class="stat-number">${unpaid}</span><span class="stat-label">To'lamagan</span></div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-content"><span class="stat-number">${partial}</span><span class="stat-label">Qisman</span></div></div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
          <select id="payFilterStatus" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--body-bg);color:var(--text-primary)"><option value="">Barcha holat</option><option value="paid">To'langan</option><option value="unpaid">To'lamagan</option><option value="partial">Qisman</option></select>
          <select id="payFilterCourse" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--body-bg);color:var(--text-primary)"><option value="">Barcha kurs</option>${coursesData.map(c => `<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('')}</select>
          <input type="month" id="payFilterMonth" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--body-bg);color:var(--text-primary)">
          <button class="btn btn-primary" data-action="addPayment"><i class="fas fa-plus-circle"></i> To'lov qo'shish</button>
        </div>
        <div class="responsive-table"><table><thead><tr><th>O'quvchi</th><th>Kurs</th><th>Miqdor</th><th>Turi</th><th>Sana</th><th>Keyingi</th><th>Holat</th><th>Amallar</th></tr></thead><tbody id="paymentTableBody"></tbody></table></div>
      `;

      function renderPayments(){
        const statusF = document.getElementById('payFilterStatus').value;
        const courseF = document.getElementById('payFilterCourse').value;
        const monthF = document.getElementById('payFilterMonth').value;
        let filtered = paymentsData;
        if(statusF) filtered = filtered.filter(p => p.status === statusF);
        if(courseF) filtered = filtered.filter(p => String(p.courseId) === String(courseF));
        if(monthF){
          const [y, m] = monthF.split('-');
          filtered = filtered.filter(p => {
            const d = new Date(p.date);
            return d.getFullYear() === parseInt(y) && d.getMonth() === parseInt(m) - 1;
          });
        }
        const tbody = document.getElementById('paymentTableBody');
        tbody.innerHTML = filtered.map(p => {
          const st = studentMap[p.studentId];
          const cr = courseMap[p.courseId];
          let statusText, statusClass;
          if(p.status === 'paid'){ statusText = 'To\'langan'; statusClass = 'badge-green'; }
          else if(p.status === 'partial'){ statusText = 'Qisman'; statusClass = 'badge-yellow'; }
          else{ statusText = 'To\'lamagan'; statusClass = 'badge-red'; }
          return `<tr>
            <td>${st ? escapeHTML(st.first_name || st.firstName) + ' ' + escapeHTML(st.last_name || st.lastName) : '-'}</td>
            <td>${cr ? escapeHTML(cr.name) : '-'}</td>
            <td>${formatCurrency(p.amount)}</td>
            <td>${escapeHTML(p.type || 'naqd')}</td>
            <td>${formatDate(p.date)}</td>
            <td>${formatDate(p.nextPaymentDate)}</td>
            <td><span class="badge ${statusClass}">${statusText}</span></td>
            <td class="actions">
              <button class="btn btn-sm btn-outline" onclick="editPayment('${escapeHTML(p.id)}')"><i class="fas fa-edit"></i></button>
              <button class="btn btn-sm btn-danger" onclick="deletePayment('${escapeHTML(p.id)}')"><i class="fas fa-trash"></i></button>
            </td>
          </tr>`;
        }).join('') || '<tr><td colspan="8" class="empty-state">To\'lovlar mavjud emas</td></tr>';
      }

      document.getElementById('payFilterStatus').addEventListener('change', renderPayments);
      document.getElementById('payFilterCourse').addEventListener('change', renderPayments);
      document.getElementById('payFilterMonth').addEventListener('change', renderPayments);
      el.querySelector('[data-action="addPayment"]').onclick = () => openPaymentModal(null);
      renderPayments();
    }

    window.deletePayment = async function(id){
      if(!confirm('To\'lov o\'chirilsinmi?')) return;

      try {
        const response = await apiFetch(`/api/payments/${id}/`, {
          method: 'DELETE'
        });

        if (response.ok) {
          toast('To\'lov o\'chirildi', 'success');
          renderPage('payments');
        } else {
          const error = await response.json();
          toast('Xatolik: ' + (error.detail || 'O\'chirilmadi'), 'error');
        }
      } catch(err) {
        console.error('Error deleting payment:', err);
        toast('O\'chirishda xatolik', 'error');
      }
    };

    window.editPayment = function(id){
      openPaymentModal(id);
    };

    // ============================================================
    // OPEN PAYMENT MODAL (API bilan)
    // ============================================================
    async function openPaymentModal(id){
      let payment = null;
      let studentsData = [];
      let coursesData = [];

      try {
        const [studentsRes, coursesRes] = await Promise.all([
          apiFetch('/api/students/'),
          apiFetch('/api/courses/')
        ]);
        studentsData = await studentsRes.json();
        coursesData = await coursesRes.json();

        if (id) {
          const paymentRes = await apiFetch(`/api/payments/${id}/`);
          if (paymentRes.ok) {
            const p = await paymentRes.json();
            payment = {
              id: p.id,
              studentId: p.student_id || p.studentId || '',
              courseId: p.course_id || p.courseId || '',
              amount: p.amount || 0,
              type: p.type || 'naqd',
              date: p.date || '',
              nextPaymentDate: p.next_payment_date || p.nextPaymentDate || '',
              status: p.status || 'unpaid',
              note: p.note || '',
              teacherId: p.teacher_id || p.teacherId || ''
            };
          }
        }
      } catch(err) {
        console.error('Error loading payment:', err);
        toast('Ma\'lumotlarni yuklashda xatolik', 'error');
        return;
      }

      const modal = document.getElementById('modalContent');

      modal.innerHTML = `
        <div class="modal-header"><h3><i class="fas ${payment ? 'fa-edit' : 'fa-plus-circle'}"></i> ${payment ? 'Tahrirlash' : 'Yangi to\'lov'}</h3><button class="modal-close" onclick="window.closeModal()"><i class="fas fa-times"></i></button></div>
        <div class="form-group" style="position:relative">
          <label><i class="fas fa-user-graduate"></i> O'quvchi (ism yoki familiya yozing)</label>
          <input id="pStudentSearch" autocomplete="off" placeholder="Ism yoki familiya kiriting..." style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--body-bg);color:var(--text-primary)">
          <div id="pStudentResults" class="search-results-dropdown-inline"></div>
          <input type="hidden" id="pStudent" value="${payment ? payment.studentId : ''}">
        </div>
        <div id="selectedStudentDisplay" style="${payment ? 'display:block' : 'display:none'};padding:8px 12px;background:var(--gray100);border-radius:6px;margin-bottom:10px;color:var(--text-primary)">
          ${payment ? `Tanlangan: <strong>${studentsData.find(s => String(s.id) === String(payment.studentId))?.first_name || studentsData.find(s => String(s.id) === String(payment.studentId))?.firstName || ''} ${studentsData.find(s => String(s.id) === String(payment.studentId))?.last_name || studentsData.find(s => String(s.id) === String(payment.studentId))?.lastName || ''}</strong>` : ''}
        </div>
        <div class="form-group"><label><i class="fas fa-book-open"></i> Kurs</label>
          <select id="pCourse">
            <option value="">Kursni tanlang</option>
            ${coursesData.map(c => `<option value="${c.id}" ${payment && String(payment.courseId) === String(c.id) ? 'selected' : ''}>${escapeHTML(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="flex-row">
          <div class="form-group"><label><i class="fas fa-money-bill-wave"></i> Miqdor (so'm)</label>
            <div class="currency-input-wrap">
              <input type="text" id="pAmount" value="${payment ? formatNumber(payment.amount) : ''}"
                     oninput="formatNumberInput(this)" style="width:100%">
              <span class="currency-suffix">so'm</span>
            </div>
          </div>
          <div class="form-group"><label><i class="fas fa-credit-card"></i> To'lov turi</label>
            <select id="pType" style="width:100%">
              <option value="naqd" ${payment && payment.type === 'naqd' ? 'selected' : ''}>Naqd</option>
              <option value="karta" ${payment && payment.type === 'karta' ? 'selected' : ''}>Karta</option>
              <option value="bank" ${payment && payment.type === 'bank' ? 'selected' : ''}>Bank</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-info-circle"></i> Holat</label>
          <select id="pStatus" style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--body-bg);color:var(--text-primary)">
            <option value="paid" ${payment && payment.status === 'paid' ? 'selected' : ''}>To'langan</option>
            <option value="unpaid" ${payment && payment.status === 'unpaid' ? 'selected' : ''}>To'lamagan</option>
            <option value="partial" ${payment && payment.status === 'partial' ? 'selected' : ''}>Qisman</option>
          </select>
        </div>
        <div class="form-group"><label><i class="fas fa-sticky-note"></i> Izoh</label><input id="pNote" value="${payment ? escapeHTML(payment.note) : ''}" style="width:100%"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
          <button class="btn" onclick="window.closeModal()"><i class="fas fa-times"></i> Bekor qilish</button>
          <button class="btn btn-primary" id="savePaymentBtn"><i class="fas fa-save"></i> Saqlash</button>
        </div>
      `;
      openModal();

      const studentSearch = document.getElementById('pStudentSearch');
      const studentResults = document.getElementById('pStudentResults');
      const selectedDisplay = document.getElementById('selectedStudentDisplay');
      const studentHidden = document.getElementById('pStudent');

      if(payment){
        const st = studentsData.find(s => String(s.id) === String(payment.studentId));
        if(st){
          studentSearch.value = (st.first_name || st.firstName || '') + ' ' + (st.last_name || st.lastName || '');
          selectedDisplay.innerHTML = `Tanlangan: <strong>${escapeHTML(st.first_name || st.firstName)} ${escapeHTML(st.last_name || st.lastName)}</strong>`;
          selectedDisplay.style.display = 'block';
        }
      }

      studentSearch.oninput = function(){
        const val = this.value.toLowerCase().trim();
        studentHidden.value = '';

        if(!val || val.length < 2){
          studentResults.classList.remove('show');
          selectedDisplay.style.display = 'none';
          return;
        }

        const allMatches = studentsData.filter(s =>
          ((s.first_name || s.firstName || '') + ' ' + (s.last_name || s.lastName || '')).toLowerCase().includes(val) ||
          (s.first_name || s.firstName || '').toLowerCase().includes(val) ||
          (s.last_name || s.lastName || '').toLowerCase().includes(val)
        );
        const filtered = allMatches.slice(0, 8);

        if(filtered.length === 0){
          studentResults.innerHTML = '<div style="padding:10px;color:var(--text-secondary);text-align:center">Hech qanday o\'quvchi topilmadi</div>';
          studentResults.classList.add('show');
          return;
        }

        studentResults.innerHTML = filtered.map(s => `
          <div class="search-result-item-inline" data-id="${s.id}">
            <div class="avatar-sm">${escapeHTML((s.first_name || s.firstName || '')[0])}${escapeHTML((s.last_name || s.lastName || '')[0])}</div>
            <div>
              <div style="font-weight:500;color:var(--text-primary)">${escapeHTML(s.first_name || s.firstName)} ${escapeHTML(s.last_name || s.lastName)}</div>
              <div style="font-size:12px;color:var(--text-secondary)">${escapeHTML(s.phone || '')} · ${coursesData.find(c => String(c.id) === String(s.course_id || s.courseId))?.name || 'Kurs yo\'q'}</div>
            </div>
          </div>
        `).join('') + (allMatches.length > 8 ? `<div style="padding:6px 10px;color:var(--text-secondary);text-align:center;font-size:11px">... yana ${allMatches.length - 8} ta natija</div>` : '');

        studentResults.classList.add('show');

        studentResults.querySelectorAll('.search-result-item-inline').forEach(item => {
          item.addEventListener('mousedown', function(e){
            e.preventDefault();
            const id = this.dataset.id;
            const st = studentsData.find(s => String(s.id) === String(id));
            if(st){
              studentHidden.value = id;
              studentSearch.value = (st.first_name || st.firstName || '') + ' ' + (st.last_name || st.lastName || '');
              selectedDisplay.innerHTML = `Tanlangan: <strong>${escapeHTML(st.first_name || st.firstName)} ${escapeHTML(st.last_name || st.lastName)}</strong>`;
              selectedDisplay.style.display = 'block';
              studentResults.classList.remove('show');

              const courseSelect = document.getElementById('pCourse');
              if(st.course_id || st.courseId){
                courseSelect.value = st.course_id || st.courseId;
              }
            }
          });
        });
      };

      document.addEventListener('click', function(e){
        if(!e.target.closest('#pStudentSearch') && !e.target.closest('#pStudentResults')){
          studentResults.classList.remove('show');
        }
      });

      document.getElementById('savePaymentBtn').onclick = async function(){
        const stId = studentHidden.value;
        const cr = document.getElementById('pCourse').value;
        const amtInput = document.getElementById('pAmount');
        const amt = parseFormattedNumber(amtInput ? amtInput.value : '0');
        const status = document.getElementById('pStatus').value;

        if(!stId){ toast('Iltimos, o\'quvchini tanlang', 'error'); return; }
        if(!cr){ toast('Kursni tanlang', 'error'); return; }
        if(!amt || amt <= 0){ toast('To\'g\'ri miqdor kiriting', 'error'); return; }

        const obj = {
          student_id: stId,
          course_id: cr,
          amount: amt,
          type: document.getElementById('pType').value,
          date: payment ? payment.date : todayISO(),
          next_payment_date: payment ? payment.nextPaymentDate : new Date(Date.now() + 30 * 86400000).toISOString().slice(0,10),
          status: status,
          note: document.getElementById('pNote').value
        };

        try {
          let response;
          if(payment){
            response = await apiFetch(`/api/payments/${payment.id}/`, {
              method: 'PUT',
              body: JSON.stringify(obj)
            });
          } else {
            response = await apiFetch('/api/payments/', {
              method: 'POST',
              body: JSON.stringify(obj)
            });
          }

          if (response.ok) {
            toast(payment ? 'To\'lov yangilandi' : 'To\'lov qo\'shildi', 'success');
            window.closeModal();
            renderPage('payments');
          } else {
            const error = await response.json();
            toast('Xatolik: ' + (error.detail || 'Saqlanmadi'), 'error');
          }
        } catch(err) {
          console.error('Error saving payment:', err);
          toast('Saqlashda xatolik', 'error');
        }
      };
    }

    // ============================================================
    // SALARIES (API bilan)
    // ============================================================
    async function salaries(el){
      el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="fas fa-spinner fa-spin" style="font-size:32px"></i><p style="margin-top:12px">Ish haqi yuklanmoqda...</p></div>';

      let teachersData = [];
      let salariesData = [];

      try {
        const [teachersRes, salariesRes] = await Promise.all([
          apiFetch('/api/teachers/'),
          apiFetch('/api/salaries/')
        ]);
        teachersData = await teachersRes.json();
        salariesData = await salariesRes.json();
      } catch(err) {
        console.error('Error loading salaries:', err);
        el.innerHTML = `<div class="empty-state" style="padding:40px">
          <div class="icon"><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i></div>
          <p style="color:var(--text-secondary);margin-top:12px">Ma'lumotlarni yuklashda xatolik yuz berdi</p>
          <button class="btn btn-primary" style="margin-top:12px" onclick="renderPage('salaries')"><i class="fas fa-sync"></i> Qayta urinish</button>
        </div>`;
        return;
      }

      const teachers = teachersData.map(t => ({
        id: t.id,
        firstName: t.first_name || t.firstName || '',
        lastName: t.last_name || t.lastName || '',
        salary: t.salary || 0
      }));

      let salaries = salariesData.map(s => ({
        id: s.id,
        teacherId: s.teacher_id || s.teacherId || '',
        month: s.month || '',
        baseSalary: s.base_salary || s.baseSalary || 0,
        bonus: s.bonus || 0,
        deduction: s.deduction || 0,
        total: s.total || 0,
        status: s.status || 'pending',
        paidAt: s.paid_at || s.paidAt || null
      }));

      const currentMonth = new Date().toISOString().slice(0,7);

      el.innerHTML = `
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center">
          <input type="month" id="salaryMonth" value="${currentMonth}" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--body-bg);color:var(--text-primary)">
          <button class="btn btn-primary" id="calcSalaries"><i class="fas fa-calculator"></i> Ish haqi hisoblash</button>
          <button class="btn btn-success" id="markAllPaid"><i class="fas fa-check-double"></i> Barchasini to'lash</button>
        </div>
        <div class="responsive-table"><table><thead><tr><th>O'qituvchi</th><th>Asosiy</th><th>Bonus</th><th>Ushlab qolish</th><th>Jami</th><th>Holat</th><th>Amallar</th></tr></thead><tbody id="salaryTableBody"></tbody></table></div>
        <div style="margin-top:8px;color:var(--text-secondary)"><strong>Jami:</strong> <span id="salaryTotal">0</span></div>
      `;

      async function renderSalaries(){
        const month = document.getElementById('salaryMonth').value;

        try {
          const res = await apiFetch(`/api/salaries/?month=${month}`);
          if (res.ok) {
            const data = await res.json();
            salaries = data.map(s => ({
              id: s.id,
              teacherId: s.teacher_id || s.teacherId || '',
              month: s.month || '',
              baseSalary: s.base_salary || s.baseSalary || 0,
              bonus: s.bonus || 0,
              deduction: s.deduction || 0,
              total: s.total || 0,
              status: s.status || 'pending',
              paidAt: s.paid_at || s.paidAt || null
            }));
          }
        } catch(err) {
          console.error('Error loading salaries for month:', err);
        }

        let filtered = salaries.filter(s => s.month === month);

        if(filtered.length === 0){
          filtered = teachers.map(t => ({
            id: 'temp_' + t.id,
            teacherId: t.id,
            month,
            baseSalary: t.salary || 0,
            bonus: 0,
            deduction: 0,
            total: t.salary || 0,
            status: 'pending',
            paidAt: null
          }));
        }

        const teacherMap = Object.fromEntries(teachers.map(t => [t.id, t]));
        const tbody = document.getElementById('salaryTableBody');
        let total = 0;
        tbody.innerHTML = filtered.map(s => {
          const t = teacherMap[s.teacherId];
          const totalS = s.baseSalary + s.bonus - s.deduction;
          total += totalS;
          const statusBadge = s.status === 'paid' ? 'badge-green' : 'badge-yellow';
          return `<tr>
            <td>${t ? escapeHTML(t.firstName) + ' ' + escapeHTML(t.lastName) : '-'}</td>
            <td>
              <div class="currency-input-wrap" style="display:inline-block;width:100%;">
                <input type="text" class="salaryBase" data-id="${s.id}" value="${formatNumber(s.baseSalary)}"
                       style="width:100%;padding:4px 6px;border:1px solid var(--border-color);border-radius:4px;background:var(--body-bg);color:var(--text-primary);padding-right:40px;"
                       oninput="formatNumberInput(this)" min="0">
                <span class="currency-suffix" style="font-size:11px;">so'm</span>
              </div>
            </td>
            <td>
              <div class="currency-input-wrap" style="display:inline-block;width:100%;">
                <input type="text" class="salaryBonus" data-id="${s.id}" value="${formatNumber(s.bonus)}"
                       style="width:100%;padding:4px 6px;border:1px solid var(--border-color);border-radius:4px;background:var(--body-bg);color:var(--text-primary);padding-right:40px;"
                       oninput="formatNumberInput(this)" min="0">
                <span class="currency-suffix" style="font-size:11px;">so'm</span>
              </div>
            </td>
            <td>
              <div class="currency-input-wrap" style="display:inline-block;width:100%;">
                <input type="text" class="salaryDed" data-id="${s.id}" value="${formatNumber(s.deduction)}"
                       style="width:100%;padding:4px 6px;border:1px solid var(--border-color);border-radius:4px;background:var(--body-bg);color:var(--text-primary);padding-right:40px;"
                       oninput="formatNumberInput(this)" min="0">
                <span class="currency-suffix" style="font-size:11px;">so'm</span>
              </div>
            </td>
            <td class="salaryTotal" data-id="${s.id}">${formatCurrency(totalS)}</td>
            <td><span class="badge ${statusBadge}">${s.status === 'paid' ? 'To\'langan' : 'Kutilmoqda'}</span></td>
            <td class="actions"><button class="btn btn-sm btn-success" onclick="markSalaryPaid('${escapeHTML(s.id)}')"><i class="fas fa-check"></i> To'lash</button></td>
          </tr>`;
        }).join('') || '<tr><td colspan="7">Ma\'lumot yo\'q</td></tr>';
        document.getElementById('salaryTotal').textContent = formatCurrency(total);

        document.querySelectorAll('.salaryBase, .salaryBonus, .salaryDed').forEach(inp => {
          inp.onchange = async function(){
            const id = this.dataset.id;
            const sal = salaries.find(s => String(s.id) === String(id));
            if(!sal) return;

            const val = parseFormattedNumber(this.value);
            if(val < 0){
              toast('Qiymat manfiy bo\'lishi mumkin emas', 'warning');
              this.value = formatNumber(0);
              return;
            }

            const base = parseFormattedNumber(document.querySelector(`.salaryBase[data-id="${id}"]`).value) || 0;
            const bonus = parseFormattedNumber(document.querySelector(`.salaryBonus[data-id="${id}"]`).value) || 0;
            const ded = parseFormattedNumber(document.querySelector(`.salaryDed[data-id="${id}"]`).value) || 0;
            sal.baseSalary = base;
            sal.bonus = bonus;
            sal.deduction = ded;
            sal.total = base + bonus - ded;
            document.querySelector(`.salaryTotal[data-id="${id}"]`).textContent = formatCurrency(sal.total);

            try {
              const response = await apiFetch(`/api/salaries/${id}/`, {
                method: 'PUT',
                body: JSON.stringify({
                  teacher_id: sal.teacherId,
                  month: sal.month,
                  base_salary: base,
                  bonus: bonus,
                  deduction: ded,
                  total: sal.total,
                  status: sal.status
                })
              });
              if (!response.ok) {
                toast('Saqlashda xatolik', 'error');
              }
            } catch(err) {
              console.error('Error saving salary:', err);
            }
          };
        });
      }

      document.getElementById('calcSalaries').onclick = async function(){
        const month = document.getElementById('salaryMonth').value;

        try {
          const response = await apiFetch('/api/salaries/calculate/', {
            method: 'POST',
            body: JSON.stringify({ month: month })
          });

          if (response.ok) {
            const data = await response.json();
            salaries = data.map(s => ({
              id: s.id,
              teacherId: s.teacher_id || s.teacherId || '',
              month: s.month || '',
              baseSalary: s.base_salary || s.baseSalary || 0,
              bonus: s.bonus || 0,
              deduction: s.deduction || 0,
              total: s.total || 0,
              status: s.status || 'pending',
              paidAt: s.paid_at || s.paidAt || null
            }));
            toast('Ish haqi hisoblandi', 'success');
            renderSalaries();
          } else {
            const error = await response.json();
            toast('Xatolik: ' + (error.detail || 'Hisoblanmadi'), 'error');
          }
        } catch(err) {
          console.error('Error calculating salaries:', err);
          toast('Hisoblashda xatolik', 'error');
        }
      };

      document.getElementById('markAllPaid').onclick = async function(){
        const month = document.getElementById('salaryMonth').value;

        try {
          const response = await apiFetch('/api/salaries/mark_all_paid/', {
            method: 'POST',
            body: JSON.stringify({ month: month })
          });

          if (response.ok) {
            const data = await response.json();
            salaries = data.map(s => ({
              id: s.id,
              teacherId: s.teacher_id || s.teacherId || '',
              month: s.month || '',
              baseSalary: s.base_salary || s.baseSalary || 0,
              bonus: s.bonus || 0,
              deduction: s.deduction || 0,
              total: s.total || 0,
              status: s.status || 'pending',
              paidAt: s.paid_at || s.paidAt || null
            }));
            toast('Barchasi to\'landi', 'success');
            renderSalaries();
          } else {
            const error = await response.json();
            toast('Xatolik: ' + (error.detail || 'To\'lanmadi'), 'error');
          }
        } catch(err) {
          console.error('Error marking all paid:', err);
          toast('Xatolik', 'error');
        }
      };

      window.markSalaryPaid = async function(id){
        try {
          const response = await apiFetch(`/api/salaries/${id}/mark_paid/`, {
            method: 'POST'
          });

          if (response.ok) {
            const data = await response.json();
            const sal = salaries.find(s => String(s.id) === String(id));
            if (sal) {
              sal.status = 'paid';
              sal.paidAt = data.paid_at || todayISO();
            }
            toast('To\'landi', 'success');
            renderSalaries();
          } else {
            const error = await response.json();
            toast('Xatolik: ' + (error.detail || 'To\'lanmadi'), 'error');
          }
        } catch(err) {
          console.error('Error marking salary paid:', err);
          toast('Xatolik', 'error');
        }
      };

      document.getElementById('salaryMonth').addEventListener('change', renderSalaries);
      renderSalaries();
    }

    // ============================================================
    // REPORTS (API bilan)
    // ============================================================

        lastName: s.last_name || s.lastName || '',
        registeredAt: s.registered_at || s.registeredAt || '',

      }));

      const payments = paymentsData.map(p => ({

        studentId: p.student_id || p.studentId || '',
        courseId: p.course_id || p.courseId || '',
        amount: p.amount || 0,
        date: p.date || '',
        status: p.status || 'unpaid'
      }));

      const attendance = attendanceData.map(a => ({
        id: a.id,
        studentId: a.student_id || a.studentId || '',
        date: a.date || '',
        status: a.status || ''
      }));

      const teachers = teachersData.map(t => ({
        id: t.id,
        firstName: t.first_name || t.firstName || '',
        lastName: t.last_name || t.lastName || '',
        subject: t.subject || '',
        salary: t.salary || 0,

      const groups = groupsData.map(g => ({
        id: g.id,
        name: g.name || '',
        teacherId: g.teacher_id || g.teacherId || ''
      }));

      function renderMonthlyReport(){
        const monthNames = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        const monthlyData = [];
        for(let i = 0; i < 12; i++){
          const monthIndex = (currentMonth - i + 12) % 12;
          const yearOffset = Math.floor((currentMonth - i) / 12);
          const year = currentYear + yearOffset;

          const m = monthIndex;
          const y = year;

          const monthStudents = students.filter(s => {
            const regDate = new Date(s.registeredAt);
            return regDate.getMonth() === m && regDate.getFullYear() === y;
          });

          const monthPayments = payments.filter(p => {
            const d = new Date(p.date);
            return d.getMonth() === m && d.getFullYear() === y && p.status === 'paid';
          });

          const paymentCount = monthPayments.length;
          const income = monthPayments.reduce((sum, p) => sum + p.amount, 0);

          const debtors = payments.filter(p => {
            const d = new Date(p.date);
            return d.getMonth() === m && d.getFullYear() === y && (p.status === 'unpaid' || p.status === 'partial');
          });

          const monthAttendance = attendance.filter(a => {
            const d = new Date(a.date);
            return d.getMonth() === m && d.getFullYear() === y;
          });

          const presentCount = monthAttendance.filter(a => a.status === 'present').length;
          const totalCount = monthAttendance.length;
          const attendanceRate = totalCount > 0 ? Math.round((presentCount / totalCount) * 100) : 0;

          let change = 0;
          if(i > 0){
            const prevIncome = monthlyData[i-1]?.income || 0;
            change = prevIncome > 0 ? Math.round(((income - prevIncome) / prevIncome) * 100) : 0;
          }

          monthlyData.push({
            month: monthNames[m],
            year: y,
            students: monthStudents.length,
            income: income,
            paymentCount: paymentCount,
            debtors: debtors.length,
            attendance: attendanceRate,
            change: change,
            monthIndex: m,
            yearVal: y
          });
        }
        monthlyData.reverse();
        for(let i = 0; i < monthlyData.length; i++){
          if(i === 0){
            monthlyData[i].change = 0;
          } else {
            const prevIncome = monthlyData[i-1].income;
            const income = monthlyData[i].income;

      function drawMonthlyChart(data){
        const canvas = document.getElementById('monthlyChart');
        if(!canvas) return;

        const container = canvas.parentElement;
        const rect = container.getBoundingClientRect();
        const w = rect.width || container.clientWidth || 600;
        const h = rect.height || 240;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        const max = Math.max(...data.map(d => d.income), 1000);
        const pad = { top: 30, bottom: 30, left: 60, right: 20 };
        const chartW = w - pad.left - pad.right;
        const chartH = h - pad.top - pad.bottom;
        const gap = chartW / data.length;
        const barW = Math.min(gap * 0.5, 30);

        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim() || '#334155';
        ctx.lineWidth = 0.5;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#94A3B8';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'right';

        for(let i = 0; i <= 5; i++){
          const yPos = pad.top + chartH - (i / 5) * chartH;
          ctx.beginPath();
          ctx.moveTo(pad.left, yPos);
          ctx.lineTo(w - pad.right, yPos);
          ctx.stroke();
          ctx.fillText(formatCurrency((i / 5) * max), pad.left - 6, yPos + 3);
        }

        data.forEach((d, i) => {
          const x = pad.left + i * gap + gap / 2 - barW / 2;
          const barH = (d.income / max) * chartH;
          const y = pad.top + chartH - barH;

          const gradient = ctx.createLinearGradient(x, y, x, pad.top + chartH);
          gradient.addColorStop(0, d.income > 0 ? '#3B82F6' : '#475569');
          gradient.addColorStop(1, d.income > 0 ? '#1E3A5F' : '#334155');
          ctx.fillStyle = gradient;

          const r = 3;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + barW - r, y);
          ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
          ctx.lineTo(x + barW, y + barH - r);
          ctx.quadraticCurveTo(x + barW, y + barH, x + barW - r, y + barH);
          ctx.lineTo(x + r, y + barH);
          ctx.quadraticCurveTo(x, y + barH, x, y + barH - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill();

          if(barH > 20){
            ctx.fillStyle = 'white';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(formatCurrency(d.income).replace(' so\'m',''), x + barW / 2, y + 12);
          }

          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#F1F5F9';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          const label = d.month;
          ctx.fillText(label, x + barW / 2, pad.top + chartH + 14);
        });

        const tooltip = document.getElementById('monthlyTooltip');

        canvas.addEventListener('mousemove', function(e){
          const rect2 = this.getBoundingClientRect();
          const x = e.clientX - rect2.left;
          const y = e.clientY - rect2.top;
          const idx = Math.floor((x - pad.left) / gap);
          if(idx >= 0 && idx < data.length){
            const d = data[idx];
            const centerX = pad.left + idx * gap + gap / 2;
            if(Math.abs(x - centerX) < gap / 2){
              tooltip.style.display = 'block';
              let leftPos = e.clientX - rect2.left + 12;
              let topPos = e.clientY - rect2.top - 10;
              if(leftPos + 160 > rect2.width) {
                leftPos = e.clientX - rect2.left - 160 - 12;
              }
              if(topPos + 60 > rect2.height) {
                topPos = e.clientY - rect2.top - 60;
              }
              tooltip.style.left = Math.max(0, leftPos) + 'px';
              tooltip.style.top = Math.max(0, topPos) + 'px';
              tooltip.innerHTML = `
                <strong>${escapeHTML(d.month)} ${d.year}</strong><br>
                <i class="fas fa-money-bill-wave"></i> ${formatCurrency(d.income)}<br>
                <i class="fas fa-user-graduate"></i> ${d.students} o'quvchi<br>
                <i class="fas fa-chart-line"></i> ${d.attendance}% davomat<br>
                <i class="fas fa-credit-card"></i> ${d.paymentCount} to'lov<br>
                <i class="fas fa-exclamation-triangle"></i> ${d.debtors} qarzdor
              `;
              return;
            }
          }
          tooltip.style.display = 'none';
        });

        canvas.addEventListener('mouseleave', function(){
          tooltip.style.display = 'none';
        });
      }

        }

        const oldHash = await sha256(old);
        if(oldHash !== storedHash){
          toast('Joriy parol noto\'g\'ri!', 'error');
          return;
        }

        const passwordCheck = validatePasswordStrength(newp);
        if(!passwordCheck.valid){ toast(passwordCheck.message, 'error'); return; }
        if(newp !== conf){ toast('Parollar mos emas!', 'error'); return; }

        const newHash = await sha256(newp);
        set('educrm_password_hash', newHash);
        toast('Parol muvaffaqiyatli o\'zgartirildi!', 'success');
        document.getElementById('oldPass').value = '';
        document.getElementById('newPass').value = '';
        document.getElementById('confirmPass').value = '';
        document.getElementById('strengthBar').style.width = '0';
      };

      document.getElementById('newPass').oninput = function(){
        const val = this.value;
        const bar = document.getElementById('strengthBar');
        const check = validatePasswordStrength(val);
        const criteriaMet = [val.length >= 8, /[A-Z]/.test(val), /[0-9]/.test(val), /[^A-Za-z0-9]/.test(val)].filter(Boolean).length;
        const pct = (criteriaMet / 4) * 100;
        bar.style.width = pct + '%';
        bar.style.background = check.valid ? 'var(--success)' : criteriaMet >= 2 ? 'var(--warning)' : 'var(--danger)';
      };
    }

    // ============================================================
    // SETTINGS (to'liq - localStorage dan)
    // ============================================================
    function settings(el){
      const settings = get('educrm_settings') || {
        centerName:'EduCenter',
        address:'Toshkent',
        phone:'+998712345678',
        timezone:'Asia/Tashkent',
        lang:'uz',
        currency:"so'm",
        commissionRate:0.4,
        notifyPayment:true,
        notifyStudent:true,
        notifyAttendance:true,
        notifySalary:true
      };

      el.innerHTML = `
        <div class="settings-wrapper">
          <div class="settings-tabs">
            <button class="tab-btn active" data-tab="general"><i class="fas fa-cogs"></i> Umumiy</button>
            <button class="tab-btn" data-tab="notifications"><i class="fas fa-bell"></i> Xabarlar</button>
            <button class="tab-btn" data-tab="security"><i class="fas fa-shield-alt"></i> Xavfsizlik</button>
          </div>
          <div class="settings-content">
            <!-- GENERAL -->
            <div class="tab-pane active" id="tab-general">
              <div class="setting-group">
                <div class="group-title"><i class="fas fa-university"></i> Markaz ma'lumotlari</div>
                <div class="setting-row">
                  <div class="field">
                    <label>Markaz nomi</label>
                    <input type="text" id="setName" value="${escapeHTML(settings.centerName || 'EduCenter')}">
                  </div>
                  <div class="field">
                    <label>Manzil</label>
                    <input type="text" id="setAddress" value="${escapeHTML(settings.address || 'Toshkent')}">
                  </div>
                  <div class="field">
                    <label>Telefon</label>
                    <input type="text" id="setPhone" value="${escapeHTML(settings.phone || '+998712345678')}">
                  </div>
                  <div class="field">
                    <label>Vaqt zonasi</label>
                    <select id="setTz">
                      <option value="Asia/Tashkent" ${settings.timezone === 'Asia/Tashkent' ? 'selected' : ''}>Asia/Tashkent</option>
                      <option value="Asia/Samarkand" ${settings.timezone === 'Asia/Samarkand' ? 'selected' : ''}>Asia/Samarkand</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>Til</label>
                    <select id="setLang">
                      <option value="uz" ${settings.lang === 'uz' ? 'selected' : ''}>O'zbekcha</option>
                      <option value="ru" ${settings.lang === 'ru' ? 'selected' : ''}>Русский</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>Valyuta</label>
                    <select id="setCurr">
                      <option value="so'm" ${settings.currency === "so'm" ? 'selected' : ''}>so'm</option>
                      <option value="$" ${settings.currency === '$' ? 'selected' : ''}>$</option>
                      <option value="€" ${settings.currency === '€' ? 'selected' : ''}>€</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>O'qituvchi komissiyasi</label>
                    <div class="commission-slider">
                      <input type="range" id="setCommission" min="0" max="100" value="${Math.round((settings.commissionRate || 0.4) * 100)}">
                      <span class="value-badge" id="commissionDisplay">${Math.round((settings.commissionRate || 0.4) * 100)}%</span>
                    </div>
                  </div>
                </div>
              </div>
              <button class="btn btn-primary" id="saveSettings"><i class="fas fa-save"></i> Sozlamalarni saqlash</button>
            </div>

            <!-- NOTIFICATIONS -->
            <div class="tab-pane" id="tab-notifications">
              <div class="setting-group">
                <div class="group-title"><i class="fas fa-bell"></i> Xabar sozlamalari</div>
                <div class="setting-row" style="background:transparent; border: none; padding: 0;">
                  <div class="toggle-group">
                    <label class="toggle-item">
                      <input type="checkbox" id="notifyPayment" ${settings.notifyPayment !== false ? 'checked' : ''}> To'lov xabarlari
                    </label>
                    <label class="toggle-item">
                      <input type="checkbox" id="notifyStudent" ${settings.notifyStudent !== false ? 'checked' : ''}> O'quvchi qo'shilganda
                    </label>
                    <label class="toggle-item">
                      <input type="checkbox" id="notifyAttendance" ${settings.notifyAttendance !== false ? 'checked' : ''}> Davomat eslatmasi
                    </label>
                    <label class="toggle-item">
                      <input type="checkbox" id="notifySalary" ${settings.notifySalary !== false ? 'checked' : ''}> Ish haqi to'lovlari
                    </label>
                  </div>
                </div>
              </div>
              <button class="btn btn-primary" id="saveNotifications"><i class="fas fa-save"></i> Xabar sozlamalarini saqlash</button>
            </div>

            <!-- SECURITY -->
            <div class="tab-pane" id="tab-security">
              <div class="setting-group">
                <div class="group-title"><i class="fas fa-shield-alt"></i> Xavfsizlik</div>
                <div class="setting-row">
                  <div class="field">
                    <label>Joriy parol</label>
                    <input type="password" id="secOldPass" placeholder="••••••••">
                  </div>
                  <div class="field">
                    <label>Yangi parol</label>
                    <input type="password" id="secNewPass" placeholder="••••••••">
                  </div>
                  <div class="field">
                    <label>Tasdiqlash</label>
                    <input type="password" id="secConfirmPass" placeholder="••••••••">
                  </div>
                  <div class="field" style="justify-content: flex-end;">
                    <button class="btn btn-primary" id="secChangePass" style="width:100%;"><i class="fas fa-key"></i> Yangilash</button>
                  </div>
                </div>
                <div class="field" style="margin-top: 8px;">
                  <span style="font-size: 13px; color: var(--text-secondary);"><i class="fas fa-info-circle"></i> Parol kamida 8 belgi, bitta katta harf va raqam bo‘lishi kerak.</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      const slider = document.getElementById('setCommission');
      const display = document.getElementById('commissionDisplay');
      if(slider && display){
        slider.addEventListener('input', function(){
          display.textContent = this.value + '%';
        });
      }

      document.getElementById('saveSettings').onclick = function(){
        const commissionPct = parseInt(document.getElementById('setCommission').value);
        if(isNaN(commissionPct) || commissionPct < 0 || commissionPct > 100){
          toast('Komissiya foizi 0 dan 100 gacha bo\'lishi kerak', 'error');
          return;
        }
        const s = {
          centerName: document.getElementById('setName').value,
          address: document.getElementById('setAddress').value,
          phone: document.getElementById('setPhone').value,
          timezone: document.getElementById('setTz').value,
          lang: document.getElementById('setLang').value,
          currency: document.getElementById('setCurr').value,
          commissionRate: commissionPct / 100,
          notifyPayment: document.getElementById('notifyPayment')?.checked !== false,
          notifyStudent: document.getElementById('notifyStudent')?.checked !== false,
          notifyAttendance: document.getElementById('notifyAttendance')?.checked !== false,
          notifySalary: document.getElementById('notifySalary')?.checked !== false
        };
        set('educrm_settings', s);
        toast('Sozlamalar saqlandi!', 'success');
        renderPage('settings');
      };

      document.getElementById('saveNotifications').onclick = function(){
        const settings = get('educrm_settings') || {};
        settings.notifyPayment = document.getElementById('notifyPayment').checked;
        settings.notifyStudent = document.getElementById('notifyStudent').checked;
        settings.notifyAttendance = document.getElementById('notifyAttendance').checked;
        settings.notifySalary = document.getElementById('notifySalary').checked;
        set('educrm_settings', settings);
        toast('Xabar sozlamalari saqlandi!', 'success');
        renderPage('settings');
      };

      document.getElementById('secChangePass').onclick = async function(){
        const old = document.getElementById('secOldPass').value;
        const newp = document.getElementById('secNewPass').value;
        const conf = document.getElementById('secConfirmPass').value;
        const storedHash = get('educrm_password_hash');

        if(!storedHash){
          toast('Tizim xatosi: parol hash topilmadi.', 'error');
          return;
        }

        const oldHash = await sha256(old);
        if(oldHash !== storedHash){
          toast('Joriy parol noto\'g\'ri!', 'error');
          return;
        }

        const passwordCheck = validatePasswordStrength(newp);
        if(!passwordCheck.valid){ toast(passwordCheck.message, 'error'); return; }
        if(newp !== conf){ toast('Parollar mos emas!', 'error'); return; }

        const newHash = await sha256(newp);
        set('educrm_password_hash', newHash);
        toast('Parol muvaffaqiyatli o\'zgartirildi!', 'success');
        document.getElementById('secOldPass').value = '';
        document.getElementById('secNewPass').value = '';
        document.getElementById('secConfirmPass').value = '';
      };

      document.querySelectorAll('.settings-tabs .tab-btn').forEach(btn => {
        btn.onclick = function(){
          document.querySelectorAll('.settings-tabs .tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          document.querySelectorAll('.settings-content .tab-pane').forEach(p => p.classList.remove('active'));
          document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        };
      });
    }

    // ============================================================
    // INITIALIZE APP
    // ============================================================
    async function initializeApp() {
      try {
        const auth = get('educrm_auth');
        if (auth && checkSession()) {
          document.body.classList.remove('login-mode');
          document.getElementById('sidebar').style.display = 'flex';
          renderPage('dashboard');
        } else {
          document.body.classList.add('login-mode');
          document.getElementById('sidebar').style.display = 'none';
          renderPage('login');
        }
      } catch (err) {
        console.error('Initialize error:', err);
        toast('Tizimni ishga tushirishda xatolik yuz berdi', 'error');
        renderPage('login');
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    initializeApp();

    document.addEventListener('click', function(e){
      const side = document.getElementById('sidebar');
      if(side.classList.contains('open') && !side.contains(e.target) && !e.target.closest('.hamburger')){
        side.classList.remove('open');
      }
    });

  })();
</script>
</body>
</html>
